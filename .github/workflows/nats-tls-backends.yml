# NATS TLS smoke CI.
#
# The NATS modules route TLS through tls_mgm using a 'nats'
# client_domain.  This workflow pins that path: a real nats-server with
# TLS, OpenSIPS booted with tls_mgm + cachedb_nats, the handshake
# completing end-to-end, plus four negative scenarios that exercise the
# operator-error path.  The same built tree also config-checks every
# opensips example in the NATS READMEs.
#
# The single source of truth is lib/nats/tests/test_tls_mgm_smoke.sh
# which is what we exec at the end -- so any expansion of the smoke
# extends the shell test rather than this workflow.
#
# Security note: every `run:` block uses only literal strings and
# env:-set version pins.  No untrusted github.event.* values are
# interpolated into shell commands.

name: NATS TLS Backends

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - 'lib/nats/**'
      - 'modules/event_nats/**'
      - 'modules/cachedb_nats/**'
      - 'modules/cachedb_nats_fts/**'
      - 'modules/nats_consumer/**'
      - 'modules/tls_mgm/**'
      - 'modules/tls_openssl/**'
      - 'scripts/build/install_libnats.sh'
      - '.github/workflows/nats-tls-backends.yml'
  pull_request:
    paths:
      - 'lib/nats/**'
      - 'modules/event_nats/**'
      - 'modules/cachedb_nats/**'
      - 'modules/cachedb_nats_fts/**'
      - 'modules/nats_consumer/**'
      - 'modules/tls_mgm/**'
      - 'modules/tls_openssl/**'
      - 'scripts/build/install_libnats.sh'
      - '.github/workflows/nats-tls-backends.yml'

jobs:
  tls_mgm_smoke:
    name: tls_mgm NATS TLS smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps + build libnats from source
        run: |
          # Ubuntu's libnats-dev predates several symbols referenced
          # by lib/nats/nats_dl_table.def (kvStore_WatchMulti,
          # kvStore_WatchAll-with-opts, ...); the X-macro that
          # materialises the dl table needs every symbol declared
          # in nats/nats.h at compile time even though the actual
          # link is lazy via dlopen.  Build pinned upstream so the
          # symbol set matches what lib/nats was developed against.
          set -e
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libpcre3-dev libxml2-dev cmake \
            autoconf automake libtool git \
            nats-server netcat-openbsd
          # One pinned nats.c SHA across every CI leg; the pin
          # lives in install_libnats.sh.  TLS=ON: this leg exercises
          # NATS-over-TLS.
          SUDO=sudo LIBNATS_TLS=ON sh scripts/build/install_libnats.sh
      - name: Install nats CLI (pinned)
        run: |
          # the nats_consumer smoke creates its stream and publishes with
          # it; the event_nats e2e tests read message headers
          # (stream get --json) and create credentials (nats auth)
          wget -q https://github.com/nats-io/natscli/releases/download/v0.3.1/nats-0.3.1-amd64.deb
          sudo dpkg -i nats-0.3.1-amd64.deb
          nats --version
      - name: Build OpenSIPS core + tls_mgm + NATS modules
        run: |
          set -e
          make -j"$(nproc)" opensips
          for m in signaling sl tm rr maxfwd sipmsgops proto_udp mi_datagram mi_fifo cfgutils \
                   tls_mgm tls_openssl \
                   cachedb_nats cachedb_nats_fts event_nats nats_consumer; do
            make modules=modules/$m modules
          done
      - name: Docs — every opensips example in the NATS READMEs passes opensips -C
        run: |
          bash lib/nats/tests/selftest_readme_examples.sh
          bash lib/nats/tests/test_readme_examples.sh
      - name: Run lib/nats tls_mgm smoke
        run: |
          set -e
          # The smoke spins up its own private nats-server with self-
          # signed certs under a per-test workdir, boots opensips with
          # tls_mgm + cachedb_nats against it, and asserts handshake
          # completion plus negative scenarios (no tls_mgm loaded, no
          # 'nats' client_domain, ca_dir directory path, verify_cert=0,
          # a broker certificate issued for another host).
          bash lib/nats/tests/test_tls_mgm_smoke.sh
      - name: Run the event_nats JetStream and outage e2e tests
        run: |
          # Each starts its own private nats-server.  Exit 77 means a
          # missing prerequisite: a failure here, not a skip.
          for t in test_js_msg_id_e2e.sh test_js_ack_retry_e2e.sh \
                   test_publish_during_disconnect.sh; do
            rc=0
            bash "modules/event_nats/tests/$t" || rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "$t: rc=$rc"
              exit 1
            fi
          done
      - name: Run the lib/nats credential e2e tests
        run: |
          # user/password, token, NKey, creds file, TLS client certificate
          # against a private nats-server.  Exit 77 is a failure here.
          for t in test_auth_e2e.sh; do
            rc=0
            bash "lib/nats/tests/$t" || rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "$t: rc=$rc"
              exit 1
            fi
          done
      - name: Build a wolfSSL-backed libnats (lib/nats/patches)
        run: |
          PREFIX="$RUNNER_TEMP/nats-wolfssl" \
            sh lib/nats/patches/build_libnats_wolfssl.sh
      - name: Run both tls_mgm smokes on the wolfSSL-backed libnats
        run: |
          set -e
          lib=$(ls "$RUNNER_TEMP"/nats-wolfssl/libnats/lib/libnats.so.* \
                | grep -E '\.so\.[0-9]+\.[0-9]+$' | head -1)
          export NATS_DL_LIBNATS_PATH="$lib"
          bash lib/nats/tests/test_tls_mgm_smoke.sh
          bash modules/nats_consumer/tests/test_tls_mgm_consumer_smoke.sh
