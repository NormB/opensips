# NATS TLS smoke CI.
#
# The NATS modules route TLS through tls_mgm using a 'nats'
# client_domain.  This workflow pins that path: a real nats-server with
# TLS, OpenSIPS booted with tls_mgm + cachedb_nats, the handshake
# completing end-to-end, plus four negative scenarios that exercise the
# operator-error path.  The same built tree also config-checks every
# opensips example in the NATS READMEs.
#
# The single source of truth is modules-contrib/nats/tests/test_tls_mgm_smoke.sh
# which is what we exec at the end -- so any expansion of the smoke
# extends the shell test rather than this workflow.
#
# Security note: every `run:` block uses only literal strings and
# env:-set version pins.  No untrusted github.event.* values are
# interpolated into shell commands.

name: NATS TLS Backends

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - 'modules-contrib/nats/**'
      - 'modules-contrib/event_nats/**'
      - 'modules-contrib/cachedb_nats/**'
      - 'modules-contrib/cachedb_nats_fts/**'
      - 'modules-contrib/nats_consumer/**'
      - 'modules/tls_mgm/**'
      - 'modules/tls_openssl/**'
      - 'scripts/build/install_libnats.sh'
      - '.github/workflows/nats-tls-backends.yml'
  pull_request:
    paths:
      - 'modules-contrib/nats/**'
      - 'modules-contrib/event_nats/**'
      - 'modules-contrib/cachedb_nats/**'
      - 'modules-contrib/cachedb_nats_fts/**'
      - 'modules-contrib/nats_consumer/**'
      - 'modules/tls_mgm/**'
      - 'modules/tls_openssl/**'
      - 'scripts/build/install_libnats.sh'
      - '.github/workflows/nats-tls-backends.yml'

jobs:
  tls_mgm_smoke:
    name: tls_mgm NATS TLS smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps + build libnats from source
        run: |
          # Ubuntu's libnats-dev predates several symbols referenced
          # by modules-contrib/nats/nats_dl_table.def (kvStore_WatchMulti,
          # kvStore_WatchAll-with-opts, ...); the X-macro that
          # materialises the dl table needs every symbol declared
          # in nats/nats.h at compile time even though the actual
          # link is lazy via dlopen.  Build pinned upstream so the
          # symbol set matches what modules-contrib/nats was developed against.
          set -e
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libpcre3-dev libxml2-dev cmake \
            autoconf automake libtool git \
            nats-server netcat-openbsd sip-tester jq curl python3
          # the nats-server package enables and starts its systemd
          # service on 4222; the tests start their own servers, and
          # test_default_url_e2e.sh needs 4222 free
          sudo systemctl disable --now nats-server
          if ss -ltn 'sport = :4222' | grep -q LISTEN; then
            echo "port 4222 still in use"; exit 1
          fi
          # One pinned nats.c SHA across every CI leg; the pin
          # lives in install_libnats.sh.  TLS=ON: this leg exercises
          # NATS-over-TLS.
          SUDO=sudo LIBNATS_TLS=ON sh scripts/build/install_libnats.sh
      - name: Install nats CLI (pinned)
        run: |
          # the nats_consumer smoke creates its stream and publishes with
          # it; the event_nats e2e tests read message headers
          # (stream get --json) and create credentials (nats auth)
          wget -q https://github.com/nats-io/natscli/releases/download/v0.3.1/nats-0.3.1-amd64.deb
          sudo dpkg -i nats-0.3.1-amd64.deb
          nats --version
      - name: Build OpenSIPS core + tls_mgm + NATS modules
        run: |
          set -e
          make -j"$(nproc)" opensips
          for m in signaling sl tm rr maxfwd sipmsgops proto_udp mi_datagram mi_fifo cfgutils \
                   tls_mgm tls_openssl \
                   b2b_entities b2b_logic clusterer nathelper proto_bin registrar usrloc; do
            make modules=modules/$m modules
          done
          make modules="modules-contrib/nats modules-contrib/cachedb_nats \
            modules-contrib/cachedb_nats_fts modules-contrib/event_nats \
            modules-contrib/nats_consumer" modules-contrib
          # one directory with every built module, for the tests that use
          # a single module path
          mkdir -p _modules
          find modules modules-contrib -maxdepth 2 -name '*.so' \
            -exec ln -sf "$(pwd)/{}" _modules/ \;
      - name: Docs — every opensips example in the NATS READMEs passes opensips -C
        run: |
          bash modules-contrib/nats/tests/selftest_readme_examples.sh
          bash modules-contrib/nats/tests/test_readme_examples.sh
      - name: Run modules-contrib/nats tls_mgm smoke
        run: |
          set -e
          # The smoke spins up its own private nats-server with self-
          # signed certs under a per-test workdir, boots opensips with
          # tls_mgm + cachedb_nats against it, and asserts handshake
          # completion plus negative scenarios (no tls_mgm loaded, no
          # 'nats' client_domain, ca_dir directory path, verify_cert=0,
          # a broker certificate issued for another host).
          bash modules-contrib/nats/tests/test_tls_mgm_smoke.sh
      - name: Run the event_nats JetStream and outage e2e tests
        run: |
          # Each starts its own private nats-server.  Exit 77 means a
          # missing prerequisite: a failure here, not a skip.
          for t in test_js_msg_id_e2e.sh test_js_ack_retry_e2e.sh \
                   test_publish_during_disconnect.sh; do
            rc=0
            bash "modules-contrib/event_nats/tests/$t" || rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "$t: rc=$rc"
              exit 1
            fi
          done
      - name: Run the modules-contrib/nats module, credential, server-order and DNS SRV e2e tests
        run: |
          # each NATS module requires nats.so; user/password, token, NKey,
          # creds file, TLS client certificate against a private
          # nats-server; DNS SRV discovery; boot without a broker.  Exit 77
          # is a failure here.
          for t in test_nats_module_required_e2e.sh test_auth_e2e.sh test_no_randomize_e2e.sh \
                   test_srv_e2e.sh test_boot_degraded_cdb_e2e.sh test_boot_degraded_e2e.sh; do
            rc=0
            bash "modules-contrib/nats/tests/$t" || rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "$t: rc=$rc"
              exit 1
            fi
          done
      - name: Run the NATS real-server tests that start their own brokers
        run: |
          # cachedb_nats KV watcher resume, outage matrix, b2b restore over
          # the map API, usrloc NAT pinging; nats_consumer async requests,
          # durable consumers across instances, NAK delay, fetch/RPC outage;
          # the module default URL (needs 127.0.0.1:4222 free, so it runs
          # before the shared broker below).  Exit 77 is a failure here.
          set -u
          for t in nats/tests/test_default_url_e2e.sh \
                   cachedb_nats/tests/test_kv_watch_resume_e2e.sh \
                   cachedb_nats/tests/test_outage_matrix_e2e.sh \
                   cachedb_nats/tests/test_map_b2b_restore_e2e.sh \
                   cachedb_nats/tests/test_usrloc_natping_e2e.sh \
                   nats_consumer/tests/test_async_request_dispatch.sh \
                   nats_consumer/tests/test_multi_instance_durable.sh \
                   nats_consumer/tests/test_nak_delay_e2e.sh \
                   nats_consumer/tests/test_outage_rpc_fetch_e2e.sh; do
            echo "::group::$t"
            rc=0
            bash "modules-contrib/$t" || rc=$?
            echo "::endgroup::"
            echo "$t: rc=$rc"
            [ "$rc" -eq 0 ] || exit 1
          done
      - name: Start a nats-server on 127.0.0.1:4222 (image pinned by digest)
        run: |
          # nats:2.11.10, the version of the nats_consumer docker-compose suite
          docker run -d --name nats4222 -p 127.0.0.1:4222:4222 \
            nats@sha256:3e8ce97694fcc370aff94d554573a416c4ed0a56fb8b02726f96440deaa22b54 -js
          for i in $(seq 1 50); do
            nats --server nats://127.0.0.1:4222 rtt --timeout 200ms >/dev/null 2>&1 && exit 0
            sleep 0.2
          done
          docker logs nats4222
          exit 1
      - name: Run the NATS real-server tests that use the broker on 4222
        run: |
          # the three modules sharing one connection, cachedb_nats CRUD and
          # KV watch, the nats_consumer process restart contract.  Exit 77
          # is a failure here.
          set -u
          for t in nats/tests/test_three_module_e2e.sh \
                   cachedb_nats/tests/test_kv_crud_e2e.sh \
                   cachedb_nats/tests/test_kv_watch_basic.sh \
                   nats_consumer/tests/test_consumer_proc_restart.sh; do
            echo "::group::$t"
            rc=0
            bash "modules-contrib/$t" || rc=$?
            echo "::endgroup::"
            echo "$t: rc=$rc"
            [ "$rc" -eq 0 ] || exit 1
          done
      - name: Stop the nats-server on 4222
        if: always()
        run: docker rm -f nats4222 >/dev/null 2>&1 || true
      - name: Build a wolfSSL-backed libnats (modules-contrib/nats/patches)
        run: |
          PREFIX="$RUNNER_TEMP/nats-wolfssl" \
            sh modules-contrib/nats/patches/build_libnats_wolfssl.sh
      - name: Run both tls_mgm smokes on the wolfSSL-backed libnats
        run: |
          set -e
          lib=$(ls "$RUNNER_TEMP"/nats-wolfssl/libnats/lib/libnats.so.* \
                | grep -E '\.so\.[0-9]+\.[0-9]+$' | head -1)
          export NATS_DL_LIBNATS_PATH="$lib"
          bash modules-contrib/nats/tests/test_tls_mgm_smoke.sh
          bash modules-contrib/nats_consumer/tests/test_tls_mgm_consumer_smoke.sh
